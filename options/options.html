<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — VPN CX Net</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div
      id="termsGate"
      class="terms-gate"
      role="dialog"
      aria-modal="true"
      aria-labelledby="termsGateTitle"
      hidden
    >
      <div class="terms-gate-panel terms-gate-panel--wide">
        <h2 class="terms-gate-title" id="termsGateTitle"></h2>
        <p class="terms-gate-lead" id="termsGateLead"></p>
        <div class="terms-gate-lang">
          <label for="termsGateLocaleSelect" id="termsGateLocaleLabel"></label>
          <select id="termsGateLocaleSelect" class="locale-select">
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="ja">日本語</option>
            <option value="zh">中文（简体）</option>
          </select>
        </div>
        <div class="terms-gate-scroll" id="termsGateBody"></div>
        <label class="terms-gate-check">
          <input type="checkbox" id="termsGateCheckbox" />
          <span id="termsGateCheckboxLabel"></span>
        </label>
        <button
          type="button"
          id="termsGateAccept"
          class="btn btn-primary terms-gate-accept"
          disabled
        ></button>
      </div>
    </div>
    <div class="page">
      <header class="header">
        <h1 id="optionsAppName">VPN CX Net</h1>
        <p class="subtitle" id="optionsSubtitle">OpenVPN</p>
      </header>
      <section class="locale-section">
        <label for="localeSelect" id="languageLabel">Language</label>
        <select id="localeSelect" class="locale-select">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ja">日本語</option>
          <option value="zh">中文（简体）</option>
        </select>
      </section>
      <section
        class="openvpn-section"
        id="openvpnSection"
        aria-labelledby="openvpnTitle"
      >
        <h2 id="openvpnTitle" class="section-title">OpenVPN</h2>
        <p class="help" id="openvpnHelp">
          Install the native host (see README). Enter the path to your .ovpn
          file, then start or stop OpenVPN.
        </p>
        <div class="field">
          <label for="ovpnPath" id="ovpnPathLabel">Path to .ovpn file</label>
          <input
            type="text"
            id="ovpnPath"
            name="ovpnPath"
            placeholder="C:\path\to\config.ovpn"
            autocomplete="off"
          />
        </div>
        <div class="actions">
          <button type="button" id="openvpnStartBtn" class="btn btn-primary">
            Start OpenVPN
          </button>
          <button type="button" id="openvpnStopBtn" class="btn btn-secondary">
            Stop OpenVPN
          </button>
        </div>
        <p
          id="openvpnStatus"
          class="message openvpn-status"
          role="status"
          aria-live="polite"
        ></p>
        <div class="field" style="margin-top: 24px">
          <label for="decodoApiKey" id="decodoApiKeyLabel"
            >Decodo API key (optional)</label
          >
          <input
            type="password"
            id="decodoApiKey"
            placeholder="Liste des pays depuis l’API Decodo"
            autocomplete="off"
          />
          <p class="help" id="decodoApiKeyHelp">
            If set, the popup also shows proxy servers from the Decodo API in
            addition to the default list.
          </p>
          <p class="affiliation-link">
            <a
              id="decodoAffiliationLink"
              href="https://dashboard.decodo.com/register?referral_code=e23589fb8ed18a412e6ac8f6926c9b13c8920c73"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-secondary"
              >Decodo — Create account</a
            >
          </p>
        </div>
      </section>
      <section
        id="privateBrowsingWarningWrap"
        class="private-browsing-warning"
        hidden
        aria-live="polite"
      >
        <h2 id="privateBrowsingWarningTitle" class="section-title"></h2>
        <p class="help" id="privateBrowsingWarningText"></p>
        <ol class="private-browsing-steps-list">
          <li id="privateBrowsingWarningStep1"></li>
          <li id="privateBrowsingWarningStep2"></li>
          <li id="privateBrowsingWarningStep3"></li>
        </ol>
        <!-- YouTube embed often fails in extension pages (Error 153). Open watch URL in a new tab instead. -->
        <div class="private-browsing-video-wrap">
          <p
            class="private-browsing-video-caption"
            id="privateBrowsingVideoCaption"
          ></p>
          <a
            id="privateBrowsingYoutubeLink"
            class="private-browsing-youtube-card"
            href="https://www.youtube.com/watch?v=yRkpfEjUQU8"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              id="privateBrowsingYoutubeThumb"
              class="private-browsing-youtube-thumb"
              src="https://i.ytimg.com/vi/yRkpfEjUQU8/hqdefault.jpg"
              alt=""
              width="480"
              height="360"
              loading="lazy"
            />
            <span class="private-browsing-youtube-play" aria-hidden="true"
              >▶</span
            >
            <span
              class="private-browsing-youtube-cta"
              id="privateBrowsingYoutubeCta"
            ></span>
          </a>
        </div>
      </section>
      <p
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
        hidden
      ></p>
      <p class="credit">
        <span id="creditPrefix">Made by </span
        ><a
          href="https://github.com/Arthur-Lefevre-dev"
          target="_blank"
          rel="noopener noreferrer"
          >Arthur Lefevre</a
        >
      </p>
      <p class="credit credit-coffee">
        <a
          href="https://www.buymeacoffee.com/llnxygv"
          target="_blank"
          rel="noopener noreferrer"
          ><img
            src="https://img.buymeacoffee.com/button-api/?text=Buy%20me%20a%20coffee&emoji=&slug=llnxygv&button_colour=FF5F5F&font_colour=ffffff&font_family=Cookie&outline_colour=000000&coffee_colour=FFDD00"
            alt="Buy me a coffee"
        /></a>
      </p>
    </div>
    <script src="../locales.js"></script>
    <script src="options.js"></script>
  </body>
</html>
