<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPN CX Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <span class="logo" aria-hidden="true">🔒</span>
      <h1>VPN CX Proxy</h1>
    </header>
    <div class="current-country" id="currentCountry" aria-hidden="true">
      <img class="current-country-flag" id="currentCountryFlag" alt="">
      <span class="current-country-name" id="currentCountryName"></span>
    </div>
    <div class="traffic" id="trafficWrap">
      <div class="traffic-row"><span class="traffic-label">↓ Descendant</span><span class="traffic-value" id="trafficDown">—</span></div>
      <div class="traffic-row"><span class="traffic-label">↑ Montant</span><span class="traffic-value" id="trafficUp">—</span></div>
      <div class="traffic-row traffic-total"><span class="traffic-label">Total</span><span class="traffic-value" id="trafficTotal">—</span></div>
    </div>
    <div class="status" id="status" role="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Chargement…</span>
    </div>
    <p class="proxy-info" id="proxyInfo" aria-live="polite"></p>
    <div class="server-select-wrap" id="serverSelectWrap">
      <label class="server-select-label">Pays</label>
      <div class="server-select-trigger" id="serverSelectTrigger" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-label="Choisir un pays">
        <span class="server-select-value" id="serverSelectValue"></span>
      </div>
      <div class="server-select-dropdown" id="serverSelectDropdown" role="listbox" aria-hidden="true"></div>
    </div>
    <div class="actions">
      <button type="button" id="toggleBtn" class="btn btn-primary" disabled>
        Activer le proxy
      </button>
      <button type="button" id="optionsBtn" class="btn btn-secondary">Paramètres</button>
    </div>
    <p class="credit">
      Made by <a href="https://github.com/Arthur-Lefevre-dev" target="_blank" rel="noopener noreferrer">Arthur Lefevre</a>
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
